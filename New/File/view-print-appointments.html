<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>View & Print Appointments</title>

  <!-- Firebase (Compat) Scripts -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    /* ---------- Global Styles ---------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(45deg, #c4e0e5, #4ca1af);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Main Container ---------- */
    .container {
      width: 85%;
      max-width: 1200px;
      background-color: #ffffff;
      margin: 30px auto;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      padding: 20px;
      text-align: center;
    }
    .header {
      margin-bottom: 20px;
    }
    .header h2 {
      color: #2c3e50;
      margin: 0;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* ---------- Table Styles ---------- */
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 20px 0;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 12px;
      text-align: center;
      font-size: 15px;
    }
    th {
      background-color: #0d6efd;
      color: white;
      font-weight: 600;
    }

    /* ---------- Buttons Container ---------- */
    .btn-group {
      margin-bottom: 20px;
    }

    /* ---------- Buttons ---------- */
    button {
      font-size: 16px;
      border: none;
      border-radius: 8px;
      padding: 16px 28px;
      margin: 8px;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-cancel {
      background-color: #e74c3c;
      color: #fff;
    }
    .btn-cancel:hover {
      background-color: #c0392b;
    }
    .btn-reschedule {
      background-color: #f1c40f;
      color: #fff;
    }
    .btn-reschedule:hover {
      background-color: #d4ac0d;
    }
    .btn-print {
      background-color: #2980b9;
      color: #fff;
      display: none; /* hidden until a checkbox is selected */
    }
    .btn-print:hover {
      background-color: #1f6391;
    }

    /* ---------- Modal (Reschedule) ---------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none; /* Hidden by default */
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal {
      background: #fff;
      width: 400px;
      max-width: 90%;
      border-radius: 10px;
      padding: 20px;
      position: relative;
      text-align: left;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .modal h3 {
      margin-top: 0;
      font-weight: 600;
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .time-slot-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 10px;
    }
    .time-slot {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      cursor: pointer;
      text-align: center;
      transition: 0.3s;
      background-color: #f7f7f7;
    }
    .time-slot:hover {
      background-color: #2980b9;
      color: white;
    }
    .time-slot.selected {
      background-color: #2980b9;
      color: white;
      border: none;
    }
    .modal-buttons {
      margin-top: 15px;
      text-align: right;
    }
    .modal-buttons button {
      margin-left: 10px;
    }

    /* ---------- Print Token Layout ---------- */
    #printContainer {
      display: none; /* We'll make it visible just before printing */
    }
    .print-page {
      width: 650px;
      margin: 20px auto;
      padding: 25px 35px;
      border: 4px solid #2980b9;
      border-radius: 12px;
      text-align: left;
      page-break-after: always; /* Force each token on its own page */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      position: relative;
    }
    .token-header {
      background-color: #3498db;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      border-radius: 12px 12px 0 0;
      margin: -25px -35px 20px -35px;
    }
    .token-header span {
      display: block;
      font-size: 16px;
      font-weight: 400;
      margin-top: 5px;
    }
    .token-body {
      margin-top: 10px;
      line-height: 1.6;
      font-size: 16px;
      color: #2c3e50;
    }
    .token-body p {
      margin: 10px 0;
    }
    .token-footer {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      color: #333;
      border-top: 1px solid #ccc;
      padding-top: 10px;
    }
    .token-footer em {
      color: #2980b9;
    }

    /* Hide original table & buttons when printing the tokens */
    @media print {
      .container, .modal-overlay, table, .btn-group, .header {
        display: none !important;
      }
      #printContainer {
        display: block !important;
      }
    }
  </style>
</head>

<body>
  <!-- Main Container -->
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h2>Global Care Hospital - Appointment List</h2>
    </div>

    <!-- Table of Appointments -->
    <table>
      <thead>
        <tr>
          <th>Select</th>
          <th>Doctor</th>
          <th>Specialty</th>
          <th>Patient Name</th>
          <th>Email</th>
          <th>Appointment Date</th>
          <th>Time</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="appointmentsTable">
        <!-- Rows inserted dynamically -->
      </tbody>
    </table>

    <!-- Action Buttons -->
    <div class="btn-group">
      <button class="btn-cancel" id="cancelAppointment">Cancel Appointment</button>
      <button class="btn-reschedule" id="rescheduleAppointment">Reschedule Appointment</button>
      <a href="billing.html"
   style="
     display: inline-block;
     background-color: #4CAF50; /* Green background */
     color: #fff;
     padding: 12px 24px;
     border: 1px solid #388E3C; /* Slightly darker border */
     border-radius: 0;         /* No rounded corners -> box shape */
     text-decoration: none;
     font-weight: bold;
     box-shadow: 0 4px 6px rgba(0,0,0,0.2);
     transition: transform 0.3s;
     margin: 20px auto;
   "
   onmouseover="this.style.transform='scale(1.03)'"
   onmouseout="this.style.transform='scale(1)'"
>
  Go to Billing Page
</a>


    </div>
  </div>

  <!-- Reschedule Modal -->
  <div class="modal-overlay" id="rescheduleModal">
    <div class="modal">
      <button class="close-btn" onclick="closeModal()">✖</button>
      <h3>Reschedule Appointment</h3>
      <p>Select a new time slot:</p>
      <div class="time-slot-container" id="timeSlotContainer">
        <!-- Time slots will be generated here -->
      </div>
      <div class="modal-buttons">
        <button onclick="closeModal()">Cancel</button>
        <button id="confirmRescheduleBtn">Confirm Reschedule</button>
      </div>
    </div>
  </div>

  <!-- Hidden Container for Print Tokens -->
  <div id="printContainer"></div>

  <script>
    /***********************************************
     *  1) FIREBASE INITIALIZATION
     ***********************************************/
    const firebaseConfig = {
      apiKey: "AIzaSyBAJPsFJ-nChUw1e23UC8sO299Gw2inqgM",
      authDomain: "urproject3-82514.firebaseapp.com",
      projectId: "urproject3-82514",
      storageBucket: "urproject3-82514.firebasestorage.app",
      messagingSenderId: "120878746844",
      appId: "1:120878746844:web:03e7e50208e9cfe093f819",
      measurementId: "G-EJFK3J5MHB"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    /***********************************************
     *  2) DOCTORS & FALLBACK ARRAYS
     ***********************************************/
    // The six doctors you specified
    const doctors = [
      "Dr. Sunita Kapoor",
      "Dr. Rajesh Verma",
      "Dr. Ramesh Gupta",
      "Dr. Manjinder Sandhu",
      "Dr. Anoop Misra",
      "Dr. Priya Sharma"
    ];
    // Fallback specialties, patient names, emails
    const specialties = [
      "Cardiology", "Neurology", "Orthopedics",
      "Gastroenterology", "Gynecology", "Pediatrics",
      "Dermatology", "Urology", "Oncology"
    ];
    const patientNames = [
      "Alice Brown", "Bob Green", "Cathy White",
      "Derek Black", "Eve Gray", "Frank Blue",
      "Gina Red", "Henry Gold", "Ivy Orange"
    ];
    const emails = [
      "alice@example.com", "bob@example.com", "cathy@example.com",
      "derek@example.com", "eve@example.com", "frank@example.com",
      "gina@example.com", "henry@example.com", "ivy@example.com"
    ];

    // Helper: returns a random item from an array
    function getRandom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    /***********************************************
     *  3) GLOBAL VARIABLES
     ***********************************************/
    let selectedRow      = null;  // The checkbox for the currently selected appointment (for reschedule)
    let selectedTimeSlot = null;  // The new time slot chosen in the modal

    const tableBody      = document.getElementById('appointmentsTable');
    const printButton    = document.getElementById('printButton');
    const cancelBtn      = document.getElementById('cancelAppointment');
    const rescheduleBtn  = document.getElementById('rescheduleAppointment');
    const printContainer = document.getElementById('printContainer');

    /***********************************************
     *  4) LOAD APPOINTMENTS FROM FIRESTORE
     ***********************************************/
    async function loadAppointments() {
      tableBody.innerHTML = "";  // Clear existing rows

      try {
        const snapshot = await db.collection("appointments").get();
        snapshot.forEach(doc => {
          const appt = doc.data();
          const docId = doc.id; // Firestore document ID

          // If Firestore is missing any field, pick a random fallback
          const doctorName  = appt.doctorName  || getRandom(doctors);
          const specialty   = appt.specialty   || getRandom(specialties);
          const patientName = appt.patientName || getRandom(patientNames);
          const email       = appt.email       || getRandom(emails);
          const date        = appt.date        || "2025-01-01";
          const time        = appt.time        || "10:00 AM";
          const status      = appt.status      || "Confirmed";

          // Create table row
          const row = document.createElement("tr");
          row.innerHTML = `
            <td>
              <input type="checkbox" class="select-patient" data-id="${docId}">
            </td>
            <td>${doctorName}</td>
            <td>${specialty}</td>
            <td>${patientName}</td>
            <td>${email}</td>
            <td>${date}</td>
            <td class="time-cell">${time}</td>
            <td class="status-cell">${status}</td>
          `;
          tableBody.appendChild(row);
        });

        // Show/hide Print button when checkboxes change
        tableBody.addEventListener('change', () => {
          const anyChecked = document.querySelectorAll('.select-patient:checked').length > 0;
          printButton.style.display = anyChecked ? 'inline-block' : 'none';
        });
      } catch (error) {
        console.error("Error loading appointments:", error);
        alert("Failed to load appointments from Firestore. See console for details.");
      }
    }

    /***********************************************
     *  5) CANCEL APPOINTMENT (DELETE IN FIRESTORE)
     ***********************************************/
    cancelBtn.addEventListener('click', async () => {
      const selectedCheckboxes = document.querySelectorAll('.select-patient:checked');
      if (selectedCheckboxes.length === 0) {
        alert('Please select at least one appointment to cancel.');
        return;
      }
      const confirmCancel = confirm('Are you sure you want to cancel (delete) the selected appointment(s)?');
      if (!confirmCancel) return;

      try {
        for (let checkbox of selectedCheckboxes) {
          const docId = checkbox.dataset.id;
          await db.collection("appointments").doc(docId).delete();
        }
        alert('Selected appointment(s) have been canceled and removed from Firestore.');
        loadAppointments(); // Refresh the table
      } catch (error) {
        console.error("Error canceling appointments:", error);
        alert("Failed to cancel (delete) appointments. See console for details.");
      }
    });

  /***********************************************
 *  5) CANCEL APPOINTMENT (DELETE IN FIRESTORE) 
 *  (Only allowed up to 24 hours before the appointment)
 ***********************************************/
cancelBtn.addEventListener('click', async () => {
  const selectedCheckboxes = document.querySelectorAll('.select-patient:checked');
  if (selectedCheckboxes.length === 0) {
    alert('Please select at least one appointment to cancel.');
    return;
  }

  const confirmCancel = confirm('Are you sure you want to cancel (delete) the selected appointment(s)?');
  if (!confirmCancel) return;

  try {
    for (let checkbox of selectedCheckboxes) {
      const docId = checkbox.dataset.id;
      const appointmentDoc = await db.collection("appointments").doc(docId).get();
      if (!appointmentDoc.exists) continue;

      const appointmentData = appointmentDoc.data();
      const appointmentTime = new Date(appointmentData.time);
      const now = new Date();

      // Check if cancellation is allowed (must be at least 24 hours before)
      const timeDiff = (appointmentTime - now) / (1000 * 60 * 60); // Convert ms to hours
      if (timeDiff < 24) {
        alert(`Appointment cannot be canceled as it is within 24 hours of the scheduled time.`);
        continue;
      }

      // Update Firestore instead of deleting, storing cancellation timestamp
      await db.collection("appointments").doc(docId).update({
        status: "Canceled",
        canceledAt: firebase.firestore.Timestamp.fromDate(now)
      });

      alert(`Appointment has been canceled and logged.`);
    }

    loadAppointments(); // Refresh the table
  } catch (error) {
    console.error("Error canceling appointments:", error);
    alert("Failed to cancel (delete) appointments. See console for details.");
  }
});

/***********************************************
 *  6) RESCHEDULE APPOINTMENT (UPDATE TIME) 
 *  (Only allowed up to 12 hours before the appointment)
 ***********************************************/
rescheduleBtn.addEventListener('click', async () => {
  const selectedCheckboxes = document.querySelectorAll('.select-patient:checked');
  if (selectedCheckboxes.length === 0) {
    alert('Please select one appointment to reschedule.');
    return;
  }
  if (selectedCheckboxes.length > 1) {
    alert('Please select only one appointment at a time to reschedule.');
    return;
  }

  const docId = selectedCheckboxes[0].dataset.id;
  const appointmentDoc = await db.collection("appointments").doc(docId).get();
  if (!appointmentDoc.exists) {
    alert("Appointment not found.");
    return;
  }

  const appointmentData = appointmentDoc.data();
  const appointmentTime = new Date(appointmentData.time);
  const now = new Date();

  // Check if rescheduling is allowed (must be at least 12 hours before)
  const timeDiff = (appointmentTime - now) / (1000 * 60 * 60); // Convert ms to hours
  if (timeDiff < 12) {
    alert(`Appointment cannot be rescheduled as it is within 12 hours of the scheduled time.`);
    return;
  }

  // Store the selected row for later
  selectedRow = selectedCheckboxes[0];
  openRescheduleModal();
});

document.getElementById('confirmRescheduleBtn').addEventListener('click', async () => {
  if (!selectedTimeSlot) {
    alert('Please select a time slot before confirming.');
    return;
  }

  const docId = selectedRow.dataset.id;
  const now = new Date();

  try {
    // Update Firestore with new time, status, and reschedule timestamp
    await db.collection("appointments").doc(docId).update({
      time: selectedTimeSlot,
      status: "Rescheduled",
      rescheduledAt: firebase.firestore.Timestamp.fromDate(now)
    });

    alert(`Appointment has been rescheduled to ${selectedTimeSlot} and logged.`);
    closeModal();
    loadAppointments(); // Refresh the table
  } catch (error) {
    console.error("Error rescheduling appointment:", error);
    alert("Failed to reschedule appointment. See console for details.");
  }
});



   

    /***********************************************
     *  8) MODAL & TIME SLOT LOGIC
     ***********************************************/
    function openRescheduleModal() {
      const modalOverlay = document.getElementById('rescheduleModal');
      modalOverlay.style.display = 'flex';
      selectedTimeSlot = null;
      // Remove 'selected' class from all time slots
      document.querySelectorAll('.time-slot').forEach(slot => {
        slot.classList.remove('selected');
      });
    }

    function closeModal() {
      const modalOverlay = document.getElementById('rescheduleModal');
      modalOverlay.style.display = 'none';
    }

    // Initialize time slots for rescheduling
    function initTimeSlots() {
      const timeSlotContainer = document.getElementById('timeSlotContainer');
      const timeSlots = [
        '09:00 AM', '09:30 AM', '10:00 AM', '10:30 AM',
        '11:00 AM', '11:30 AM', '12:00 PM', '12:30 PM',
        '01:00 PM', '01:30 PM', '02:00 PM', '02:30 PM',
        '03:00 PM', '03:30 PM', '04:00 PM'
      ];
      timeSlotContainer.innerHTML = "";
      timeSlots.forEach(slot => {
        const slotDiv = document.createElement('div');
        slotDiv.classList.add('time-slot');
        slotDiv.textContent = slot;
        slotDiv.addEventListener('click', () => {
          // Deselect others
          document.querySelectorAll('.time-slot').forEach(s => s.classList.remove('selected'));
          slotDiv.classList.add('selected');
          selectedTimeSlot = slot;
        });
        timeSlotContainer.appendChild(slotDiv);
      });
    }

    /***********************************************
     *  9) ON PAGE LOAD
     ***********************************************/
    document.addEventListener('DOMContentLoaded', async () => {
      initTimeSlots();     
      await loadAppointments(); 
    });
    
  </script>
</body>
</html>
